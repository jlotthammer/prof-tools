name: CPU tooling checks
on:
  push:
  pull_request:
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CLI
        run: python -m pip install -e .
      - name: Unit and process integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate skills
        run: python tools/validate_bundle.py
      - name: Install skills in an empty project
        run: python tools/install_skills.py --project /tmp/gpu-smoke --client codex
      - name: Model smoke
        run: prof-tools inspect --kind hardware --sku mi300a --dtype bf16 --gemm 900 900 900
